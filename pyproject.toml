[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antisite"
version = "0.0.1"
description = "Antibody paratope prediction with or without structure: cross-modal attention and modality dropout over protein-language-model and ParaSurf surface features."
requires-python = ">=3.10"
dependencies = [
    # Core ML stack — unified torch 2.5+ for ParaSurf (teacher) and Paraplume (6-PLM) coexistence.
    # torch 2.5.1+cu121 verified in smoke test. >=2.6 conflicts with transformers 4.42 CVE check.
    "torch>=2.5,<2.6",
    "torchvision",
    "numpy==1.26.4",
    "pandas>=2.2,<3",
    "scipy",
    "scikit-learn>=1.5,<2",
    "tqdm",
    "h5py",
    "biopython",
    "biopandas>=0.5.1,<1",

    # HuggingFace stack — pinned for torch 2.5 + Paraplume (uses legacy batch_encode_plus API).
    "transformers==4.42.4",
    "tokenizers==0.19.1",
    "huggingface_hub<0.30",
    "sentencepiece>=0.2",

    # Paraplume's 6 PLMs.
    "ablang2>=0.2.1,<1",
    "antiberty>=0.1.3,<1",
    "fair-esm>=2.0.0,<3",

    # Interpretability / utilities retained from Paraplume.
    "shap<1",
    "structlog>=24.0,<25",
    "typer>=0.9,<1",

    # Plotting.
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8",
]
logging = [
    "wandb",
]
# 3D-mode extras: Python deps that ParaSurf needs for its in-process feature
# extractor but that AntiSite's core does not. Install with: pip install -e ".[threed]"
# (3D mode ALSO needs OpenBabel + DMS + ParaSurf weights — see README "3D-mode setup".)
threed = [
    "torchsummary",
    "jsonpickle",
]

[tool.setuptools.packages.find]
include = ["antisite*"]

[tool.ruff]
line-length = 100
